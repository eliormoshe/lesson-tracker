<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>מעקב שיעורים</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0D0D'/%3E%3Crect x='0' y='24' width='64' height='16' fill='%237B0D1E'/%3E%3Crect x='3' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='12' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='47' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='56' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Cline x1='14' y1='9' x2='50' y2='55' stroke='%23F0DEC4' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='50' y1='9' x2='14' y2='55' stroke='%23F0DEC4' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='5.5' fill='%230D0D0D'/%3E%3Ccircle cx='32' cy='32' r='5' stroke='%23F0DEC4' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='14' cy='9' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='50' cy='9' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='14' cy='55' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='50' cy='55' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0D0D'/%3E%3Crect x='0' y='24' width='64' height='16' fill='%237B0D1E'/%3E%3Crect x='3' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='12' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='47' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Crect x='56' y='26' width='5' height='12' rx='2' fill='%230D0D0D'/%3E%3Cline x1='14' y1='9' x2='50' y2='55' stroke='%23F0DEC4' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='50' y1='9' x2='14' y2='55' stroke='%23F0DEC4' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='5.5' fill='%230D0D0D'/%3E%3Ccircle cx='32' cy='32' r='5' stroke='%23F0DEC4' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='14' cy='9' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='50' cy='9' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='14' cy='55' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='50' cy='55' r='6' stroke='%23F0DEC4' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --accent: #6D5EF6;
    --accent-soft: #EEECFE;
    --accent-ink: #5246C8;
    --green: #10B981;
    --green-soft: #DCFCE9;
    --green-ink: #0B7A57;
    --amber: #F59E0B;
    --amber-soft: #FEF3D6;
    --amber-ink: #B26C04;
    --ink: #18181B;
    --ink-2: #71717A;
    --line: #EEEEF0;
    --line-2: #E6E6EA;
    --shadow-card: 0 1px 2px rgba(24,24,27,.04), 0 6px 20px rgba(24,24,27,.05);
    --shadow-pop: 0 8px 30px rgba(24,24,27,.14), 0 2px 8px rgba(24,24,27,.08);
    --shadow-fab: 0 10px 24px rgba(109,94,246,.42);
    --r-2xl: 24px;
    --r-xl: 18px;
    --r-lg: 14px;
    --surface-2: #F4F4F6;
    --surface-3: #EDEDF0;
    --topbar-bg: rgba(250,250,250,.92);
    --tabbar-bg: rgba(255,255,255,.88);
    --dropdown-bg: #FFFFFF;
    --input-bg: #FFFFFF;
    --input-border: #E6E6EA;
    --done-chip-bg: #EEF0F4;
    --done-chip-fg: #5B6472;
    --empty-icon-bg: #F1F1F3;
    --text-xmuted: #B6B6BC;
    --sheet-handle: #D8D8DE;
    --sheet-close: #EDEDF0;
    font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #0F0F12;
    --card: #18181C;
    --accent: #7B6CF8;
    --accent-soft: #23205A;
    --accent-ink: #AFA4FA;
    --green: #10B981;
    --green-soft: #0C3026;
    --green-ink: #52D9A8;
    --amber: #F59E0B;
    --amber-soft: #3A2200;
    --amber-ink: #FBB83A;
    --ink: #EEEEF2;
    --ink-2: #7A7A88;
    --line: #242428;
    --line-2: #2E2E34;
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-pop: 0 8px 30px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    --shadow-fab: 0 10px 24px rgba(109,94,246,.6);
    --surface-2: #222228;
    --surface-3: #1C1C22;
    --topbar-bg: rgba(12,12,16,.95);
    --tabbar-bg: rgba(12,12,16,.95);
    --dropdown-bg: #1E1E26;
    --input-bg: #1A1A22;
    --input-border: #36363E;
    --done-chip-bg: #1E2228;
    --done-chip-fg: #7A8898;
    --empty-icon-bg: #1E1E24;
    --text-xmuted: #46465A;
    --sheet-handle: #3A3A42;
    --sheet-close: #28282E;
  }

  html[data-theme="dark"] body {
    background: radial-gradient(1200px 600px at 50% -10%, #141418 0%, #101014 60%, #0C0C10 100%);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: 'Rubik', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #EFEFF4 0%, #E4E4EA 60%, #DEDEE4 100%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #root { height: 100%; }

  /* stage */
  .stage {
    height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* ---------- MOBILE container ---------- */
  .app.mobile {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 560px) {
    .stage { padding: 28px; }
    .app.mobile {
      height: min(900px, calc(100dvh - 56px));
      border-radius: 44px;
      box-shadow:
        0 0 0 11px #111114,
        0 0 0 13px #2a2a30,
        0 40px 80px -20px rgba(20,20,30,.55);
    }
    .app.mobile::after {
      content: "";
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 30px;
      background: #111114;
      border-radius: 18px;
      z-index: 60;
      pointer-events: none;
    }
    .app.mobile .topbar { padding-top: 50px; }
  }

  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 18px 18px 120px;
    scroll-behavior: smooth;
  }
  .scroll::-webkit-scrollbar { width: 0; height: 0; }

  /* mobile sticky top bar (student switcher) */
  .topbar {
    position: relative;
    z-index: 45;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
    background: var(--topbar-bg);
    backdrop-filter: blur(16px) saturate(1.3);
    border-bottom: 1px solid var(--line);
  }

  /* ---------- DESKTOP container ---------- */
  .app.desktop {
    position: relative;
    width: min(1160px, calc(100% - 56px));
    height: min(880px, calc(100dvh - 56px));
    background: var(--bg);
    border-radius: 32px;
    overflow: hidden;
    display: flex; /* RTL: first child (sidebar) sits on the right */
    box-shadow: 0 34px 80px -28px rgba(20,20,30,.45), 0 0 0 1px rgba(20,20,30,.04);
  }
  .app.desktop .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--card);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 18px 20px;
  }
  .app.desktop .main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 32px 38px 48px;
    scroll-behavior: smooth;
  }
  .app.desktop .main::-webkit-scrollbar { width: 0; }
  .navitem {
    display: flex; align-items: center; gap: 13px;
    width: 100%; padding: 12px 14px; border-radius: 14px;
    font-size: 15px; font-weight: 600; color: var(--ink-2);
    transition: background .16s ease, color .16s ease;
  }
  .navitem:hover { background: var(--surface-2); }
  .navitem.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

  /* numbers */
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; }

  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    0% { transform: scale(.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-in { animation: screenIn .26s cubic-bezier(.2,.7,.2,1); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ════════════════════════════════════════════════════════════════
   מעקב שיעורים — קובץ מאוחד (UI מ-Claude Design + שכבת localStorage)
   ════════════════════════════════════════════════════════════════ */

/* ============ helpers ============ */
const fmt = (n) => "₪" + Math.round(n).toLocaleString("he-IL");

const HE_MONTHS_FULL = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
const HE_MON_SHORT = ["ינו׳", "פבר׳", "מרץ", "אפר׳", "מאי", "יוני", "יולי", "אוג׳", "ספט׳", "אוק׳", "נוב׳", "דצמ׳"];
const monthKey = (d) => `${d.getFullYear()}-${d.getMonth()}`;
const monthLabel = (y, m) => `${HE_MONTHS_FULL[m]} ${y}`;
const STUDENT_COLORS = ["#6D5EF6", "#10B981", "#F59E0B", "#EC5A8D", "#3B9EF5"];

/* ============ app logo ============ */
function AppLogo({ size = 36 }) {
  const r = size * 0.22;
  const half = size / 2;
  const stripY = size * 0.37, stripH = size * 0.26;
  const holeW = size * 0.09, holeH = stripH * 0.75;
  const holeR = size * 0.03;
  const holeY = stripY + (stripH - holeH) / 2;
  const bladeStroke = size * 0.065;
  const handleR = size * 0.11;
  const pivotR = size * 0.09;
  const p1x = size * 0.22, p1y = size * 0.14, p2x = size * 0.78;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
      {/* bg */}
      <rect width={size} height={size} rx={r} fill="#0D0D0D" />
      {/* film strip */}
      <rect x={0} y={stripY} width={size} height={stripH} fill="#7B0D1E" />
      {/* holes left */}
      <rect x={size*0.05} y={holeY} width={holeW} height={holeH} rx={holeR} fill="#0D0D0D" />
      <rect x={size*0.18} y={holeY} width={holeW} height={holeH} rx={holeR} fill="#0D0D0D" />
      {/* holes right */}
      <rect x={size*0.73} y={holeY} width={holeW} height={holeH} rx={holeR} fill="#0D0D0D" />
      <rect x={size*0.86} y={holeY} width={holeW} height={holeH} rx={holeR} fill="#0D0D0D" />
      {/* blade 1 */}
      <line x1={p1x} y1={p1y} x2={p2x} y2={size-p1y} stroke="#F0DEC4" strokeWidth={bladeStroke} strokeLinecap="round" />
      {/* blade 2 */}
      <line x1={p2x} y1={p1y} x2={p1x} y2={size-p1y} stroke="#F0DEC4" strokeWidth={bladeStroke} strokeLinecap="round" />
      {/* pivot */}
      <circle cx={half} cy={half} r={pivotR*1.2} fill="#0D0D0D" />
      <circle cx={half} cy={half} r={pivotR} stroke="#F0DEC4" strokeWidth={size*0.03} fill="none" />
      {/* handles */}
      <circle cx={p1x} cy={p1y} r={handleR} stroke="#F0DEC4" strokeWidth={size*0.04} fill="none" />
      <circle cx={p2x} cy={p1y} r={handleR} stroke="#F0DEC4" strokeWidth={size*0.04} fill="none" />
      <circle cx={p1x} cy={size-p1y} r={handleR} stroke="#F0DEC4" strokeWidth={size*0.04} fill="none" />
      <circle cx={p2x} cy={size-p1y} r={handleR} stroke="#F0DEC4" strokeWidth={size*0.04} fill="none" />
    </svg>
  );
}

/* ============ icons (clean stroke set) ============ */
function Icon({ name, size = 24, filled = false, stroke = 2 }) {
  const common = {
    width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: "currentColor",
    strokeWidth: stroke, strokeLinecap: "round", strokeLinejoin: "round",
  };
  const paths = {
    home: <><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" /></>,
    moon: <path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z" />,
    sun: <><circle cx="12" cy="12" r="4.5" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></>,
    trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4h6v2" /></>,
    lessons: <><rect x="3.5" y="4.5" width="17" height="16" rx="3" /><path d="M3.5 9h17M8 2.5v4M16 2.5v4" /><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2" /></>,
    payments: <><rect x="2.5" y="5.5" width="19" height="13" rx="3" /><path d="M2.5 10h19" /><path d="M6 14.5h3" /></>,
    settings: <><circle cx="12" cy="12" r="3.2" /><path d="M12 2.5v2.4M12 19.1v2.4M21.5 12h-2.4M4.9 12H2.5M18.7 5.3l-1.7 1.7M7 17l-1.7 1.7M18.7 18.7 17 17M7 7 5.3 5.3" /></>,
    plus: <path d="M12 5v14M5 12h14" />,
    check: <path d="M4.5 12.5 9 17l10.5-11" />,
    chevron: <path d="M15 5l-7 7 7 7" />,
    clock: <><circle cx="12" cy="12" r="9" /><path d="M12 7.5V12l3 2" /></>,
    cash: <><rect x="3" y="6" width="18" height="12" rx="2" /><circle cx="12" cy="12" r="2.4" /></>,
    bit: <><path d="M12 3v18" /><path d="M7 7h7a3 3 0 0 1 0 6H7zM7 13h8a3 3 0 0 1 0 6H7z" /></>,
    transfer: <><path d="M4 8h13l-3-3M20 16H7l3 3" /></>,
    phone: <path d="M5 4h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z" />,
    user: <><circle cx="12" cy="8" r="3.6" /><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5" /></>,
    bell: <><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" /><path d="M10 19a2 2 0 0 0 4 0" /></>,
    sparkle: <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />,
    arrowUp: <path d="M12 19V5M6 11l6-6 6 6" />,
    summary: <><path d="M5 21V10M12 21V4M19 21v-7" /><path d="M3 21h18" /></>,
    chevronDown: <path d="M6 9l6 6 6-6" />,
    addUser: <><circle cx="9" cy="8" r="3.4" /><path d="M3.5 20c.9-3.2 3.1-4.6 5.5-4.6 1 0 2 .25 2.8.7" /><path d="M17.5 14v6M14.5 17h6" /></>,
    calendar: <><rect x="3.5" y="4.5" width="17" height="16" rx="3" /><path d="M3.5 9h17M8 2.5v4M16 2.5v4" /></>,
  };
  return <svg {...common}>{paths[name]}</svg>;
}

/* ============ status chip ============ */
function StatusChip({ status }) {
  const map = {
    scheduled: { t: "מתוזמן", bg: "var(--accent-soft)", fg: "var(--accent-ink)" },
    done:      { t: "בוצע",   bg: "var(--done-chip-bg)", fg: "var(--done-chip-fg)" },
    cancelled: { t: "בוטל",   bg: "#F1F1F3",            fg: "#8A8A93" },
    paid:      { t: "שולם",   bg: "var(--green-soft)",  fg: "var(--green-ink)" },
    pending:   { t: "ממתין",  bg: "var(--amber-soft)",  fg: "var(--amber-ink)" },
  };
  const s = map[status];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5,
      background: s.bg, color: s.fg,
      fontSize: 12.5, fontWeight: 600, lineHeight: 1,
      padding: "6px 11px", borderRadius: 999, whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: "currentColor", opacity: .85 }} />
      {s.t}
    </span>
  );
}

/* ============ payment method chip ============ */
function MethodChip({ method }) {
  const map = {
    cash:     { t: "מזומן", icon: "cash" },
    bit:      { t: "ביט",   icon: "bit" },
    transfer: { t: "העברה", icon: "transfer" },
  };
  const m = map[method] || map.cash;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5,
      background: "var(--surface-2)", color: "var(--ink-2)",
      fontSize: 12.5, fontWeight: 600, lineHeight: 1,
      padding: "6px 10px", borderRadius: 999,
    }}>
      <Icon name={m.icon} size={14} stroke={2.2} />
      {m.t}
    </span>
  );
}

/* ============ generic card ============ */
function Card({ children, style, onClick, ...rest }) {
  return (
    <div
      onClick={onClick}
      style={{
        background: "var(--card)",
        borderRadius: "var(--r-2xl)",
        boxShadow: "var(--shadow-card)",
        ...style,
      }}
      {...rest}
    >
      {children}
    </div>
  );
}

/* ============ section heading ============ */
function SectionTitle({ children, action }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "22px 4px 12px" }}>
      <h2 style={{ margin: 0, fontSize: 17, fontWeight: 700, color: "var(--ink)", letterSpacing: "-.01em" }}>{children}</h2>
      {action}
    </div>
  );
}

/* ============ big touch button ============ */
function BigButton({ children, variant = "primary", onClick, icon, style }) {
  const base = {
    display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
    width: "100%", padding: "18px 20px", borderRadius: 18,
    fontSize: 16, fontWeight: 700, letterSpacing: "-.01em",
    transition: "transform .12s ease, box-shadow .15s ease, background .15s ease",
  };
  const variants = {
    primary: { background: "var(--accent)", color: "#fff", boxShadow: "0 8px 20px rgba(109,94,246,.32)" },
    ghost:   { background: "var(--card)", color: "var(--ink)", boxShadow: "var(--shadow-card)" },
    green:   { background: "var(--green)", color: "#fff", boxShadow: "0 8px 20px rgba(16,185,129,.30)" },
    soft:    { background: "var(--accent-soft)", color: "var(--accent-ink)" },
  };
  return (
    <button
      onClick={onClick}
      onMouseDown={(e) => (e.currentTarget.style.transform = "scale(.97)")}
      onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}
      onMouseLeave={(e) => (e.currentTarget.style.transform = "scale(1)")}
      style={{ ...base, ...variants[variant], ...style }}
    >
      {icon && <Icon name={icon} size={20} stroke={2.4} />}
      {children}
    </button>
  );
}

/* ============ responsive hook ============ */
function useIsDesktop(bp = 900) {
  const [d, setD] = React.useState(() => (typeof window !== "undefined" ? window.innerWidth >= bp : false));
  React.useEffect(() => {
    const mq = window.matchMedia(`(min-width:${bp}px)`);
    const h = (e) => setD(e.matches);
    setD(mq.matches);
    mq.addEventListener("change", h);
    return () => mq.removeEventListener("change", h);
  }, [bp]);
  return d;
}

const DARK_KEY = "lesson-tracker-dark";
const ThemeCtx = React.createContext({ dark: false, toggleDark: () => {} });
const useTheme = () => React.useContext(ThemeCtx);

function useDarkMode() {
  const [dark, setDark] = React.useState(() => {
    const stored = localStorage.getItem(DARK_KEY);
    if (stored !== null) return stored === "true";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  });
  React.useEffect(() => {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    localStorage.setItem(DARK_KEY, String(dark));
  }, [dark]);
  return [dark, () => setDark((d) => !d)];
}

/* ============ date helpers ============ */
const HE_DAYS = ["יום א׳", "יום ב׳", "יום ג׳", "יום ד׳", "יום ה׳", "יום ו׳", "שבת"];
function parseDT(s) { return new Date(s); }
function dDay(s) { return HE_DAYS[parseDT(s).getDay()]; }
function dDate(s) { const d = parseDT(s); return `${d.getDate()} ${HE_MON_SHORT[d.getMonth()]}`; }
function dTime(s) { const d = parseDT(s); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function dShort(s) { return `${dDay(s)} · ${dDate(s)}`; }

/* ============ billing roll-up (collected on the 1st of the following month) ============ */
function buildMonthly(lessons) {
  const map = {};
  lessons.filter((l) => l.status === "done").forEach((l) => {
    const d = parseDT(l.datetime);
    const k = `${d.getFullYear()}-${d.getMonth()}`;
    if (!map[k]) map[k] = { y: d.getFullYear(), m: d.getMonth(), count: 0, total: 0, paidCount: 0 };
    map[k].count++; map[k].total += l.price; if (l.paid) map[k].paidCount++;
  });
  return Object.values(map).map((o) => {
    const nm = o.m === 11 ? 0 : o.m + 1;
    return {
      ...o,
      paid: o.paidCount === o.count,
      label: monthLabel(o.y, o.m),
      collectShort: `1.${nm + 1}`,
      collectFull: `1 ב${HE_MONTHS_FULL[nm]}`,
    };
  }).sort((a, b) => (b.y - a.y) || (b.m - a.m));
}

function nextCollection(lessons, today) {
  const cm = today.getMonth(), cy = today.getFullYear();
  const total = lessons.filter((l) => {
    if (l.status !== "done") return false;
    const d = parseDT(l.datetime);
    return d.getMonth() === cm && d.getFullYear() === cy;
  }).reduce((s, l) => s + l.price, 0);
  const nm = cm === 11 ? 0 : cm + 1;
  return { amount: total, dateFull: `1 ב${HE_MONTHS_FULL[nm]}`, thisMonth: HE_MONTHS_FULL[cm] };
}

/* ============ stat tiles (shared) ============ */
function StatTiles({ doneCount, received, nextLesson }) {
  const tiles = [

/* ============================ LESSONS ============================ */
function LessonsScreen({ lessons, onMarkDone, onTogglePaid, onDelete, onAddLesson, wide }) {
  const [tab, setTab] = React.useState("upcoming");
  const upcoming = lessons.filter((l) => l.status === "scheduled").sort((a, b) => parseDT(a.datetime) - parseDT(b.datetime));
  const history = lessons.filter((l) => l.status !== "scheduled").sort((a, b) => parseDT(b.datetime) - parseDT(a.datetime));
  const list = tab === "upcoming" ? upcoming : history;
  return (
    <div className="screen-in">
      <ScreenHeader title="שיעורים" sub={`${upcoming.length} מתוזמנים · ${history.length} בהיסטוריה`} />
      <div style={{ display: "flex", gap: 4, background: "var(--surface-3)", padding: 4, borderRadius: 14, marginBottom: 18, maxWidth: wide ? 360 : "none" }}>
        {[["upcoming", "קרובים"], ["history", "היסטוריה"]].map(([k, t]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            flex: 1, padding: "10px", borderRadius: 11, fontSize: 14.5, fontWeight: 700,
            background: tab === k ? "var(--card)" : "transparent", color: tab === k ? "var(--ink)" : "var(--ink-2)",
            boxShadow: tab === k ? "0 1px 3px rgba(0,0,0,.08)" : "none", transition: "all .18s ease",
          }}>{t}</button>
        ))}
      </div>
      {list.length === 0
        ? <EmptyState icon="lessons" text={tab === "upcoming" ? "אין שיעורים מתוזמנים" : "אין שיעורים בהיסטוריה"} />
        : <div style={{ display: "grid", gridTemplateColumns: wide ? "1fr 1fr" : "1fr", gap: 12 }}>
            {list.map((l) => <LessonRow key={l.id} lesson={l} onMarkDone={onMarkDone} onTogglePaid={onTogglePaid} onDelete={onDelete} />)}
          </div>}
      {!wide && <FAB onClick={onAddLesson} />}
      {wide && <div style={{ marginTop: 18, maxWidth: 320 }}><BigButton variant="primary" icon="plus" onClick={onAddLesson}>שיעור חדש</BigButton></div>}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   שכבת נתונים — localStorage (נקודת ההחלפה ל-Supabase בעתיד)
   ════════════════════════════════════════════════════════════════ */
const LS_KEY = "lesson-tracker-v2";

// התחלה נקייה — בלי נתוני דמו. תלמידים ושיעורים נוצרים מתוך האפליקציה ונשמרים מקומית.
const SEED_STUDENTS = [];
const SEED_LESSONS = [];

function loadPersisted() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn("load failed", e); }
  return null;
}
const PERSISTED = loadPersisted();

/* ============================ add lesson modal ============================ */
const TODAY = new Date(); // תאריך אמיתי — האפליקציה חיה

function AddLessonModal({ defaults, onClose, onAdd, centered }) {
  const base = new Date(TODAY); base.setHours(18, 0, 0, 0);
  const defDT = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, "0")}-${String(base.getDate()).padStart(2, "0")}T18:00`;
  const [dt, setDt] = React.useState(defDT);
  const [price, setPrice] = React.useState(defaults.price);
  const [duration, setDuration] = React.useState(defaults.duration);
  const [note, setNote] = React.useState("");
  return (
    <Sheet title="שיעור חדש" onClose={onClose} centered={centered}
      footer={<BigButton variant="primary" icon="check" onClick={() => onAdd({ datetime: dt, price: +price, duration: +duration, note: note.trim() })}>הוספת שיעור</BigButton>}>
      <label style={labelStyle}>תאריך ושעה</label>
      <input type="datetime-local" value={dt} onChange={(e) => setDt(e.target.value)} style={{ ...fieldStyle, marginBottom: 16 }} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
        <div>
          <label style={labelStyle}>מחיר</label>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", right: 16, top: "50%", transform: "translateY(-50%)", fontWeight: 700, color: "var(--ink-2)" }}>₪</span>
            <input type="number" className="tnum" value={price} onChange={(e) => setPrice(e.target.value)} style={{ ...fieldStyle, paddingRight: 34 }} />
          </div>
        </div>
        <div>
          <label style={labelStyle}>משך (דק׳)</label>
          <input type="number" className="tnum" value={duration} onChange={(e) => setDuration(e.target.value)} style={fieldStyle} />
        </div>
      </div>
      <label style={labelStyle}>הערות</label>
      <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={3} placeholder="על מה עבדתם בשיעור?" style={{ ...fieldStyle, resize: "none", lineHeight: 1.5 }} />
    </Sheet>
  );
}

/* ============================ APP ============================ */
function App() {
  const isDesktop = useIsDesktop(900);
  const [dark, toggleDark] = useDarkMode();
  const [tab, setTab] = React.useState("home");
  const [students, setStudents] = React.useState(PERSISTED?.students ?? SEED_STUDENTS);
  const [lessons, setLessons] = React.useState(PERSISTED?.lessons ?? SEED_LESSONS);
  const [activeId, setActiveId] = React.useState(PERSISTED?.activeId ?? null);
  const [modal, setModal] = React.useState(null);
  const [saved, setSaved] = React.useState(false);
  const scrollRef = React.useRef(null);

  // ── persistence: שמירה אוטומטית בכל שינוי ──
  React.useEffect(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ students, lessons, activeId })); }
    catch (e) { console.warn("save failed", e); }
  }, [students, lessons, activeId]);

  React.useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab, activeId]);

  // אם התלמיד הפעיל נמחק/לא קיים — חזרה לראשון
  const active = students.find((s) => s.id === activeId) || students[0];
  const myLessons = active ? lessons.filter((l) => l.studentId === active.id) : [];

  const received = myLessons.filter((l) => l.status === "done" && l.paid).reduce((s, l) => s + l.price, 0);
  const debt = myLessons.filter((l) => l.status === "done" && !l.paid).reduce((s, l) => s + l.price, 0);
  const doneCount = myLessons.filter((l) => l.status === "done").length;
  const nextLesson = myLessons.filter((l) => l.status === "scheduled").sort((a, b) => parseDT(a.datetime) - parseDT(b.datetime))[0];
  const recent = [...myLessons].sort((a, b) => parseDT(b.datetime) - parseDT(a.datetime)).slice(0, 4);
  const months = buildMonthly(myLessons);

  const markDone = (id) => setLessons((ls) => ls.map((l) => (l.id === id ? { ...l, status: "done" } : l)));
  const togglePaid = (id) => setLessons((ls) => ls.map((l) => (l.id === id ? { ...l, paid: !l.paid, paidAt: !l.paid ? new Date().toISOString() : null } : l)));
  const deleteLesson = (id) => setLessons((ls) => ls.filter((l) => l.id !== id));
  const addLesson = (d) => {
    setLessons((ls) => [...ls, { id: "n" + Date.now(), studentId: active.id, status: "scheduled", paid: false, ...d }]);
    setModal(null); setTab("lessons");
  };
  const addStudent = (d) => {
    const id = "s" + Date.now();
    const color = STUDENT_COLORS[students.length % STUDENT_COLORS.length];
    setStudents((ss) => [...ss, { id, color, ...d }]);
    setActiveId(id); setModal(null); setTab("home");
  };
  const updateStudent = (k, v) => setStudents((ss) => ss.map((s) => (s.id === active.id ? { ...s, [k]: v } : s)));
  const saveSettings = () => { setSaved(true); setTimeout(() => setSaved(false), 1800); };

  const renderScreen = (wide) => {
    if (!active) return (
      <div className="screen-in" style={{ paddingTop: wide ? 60 : 30 }}>
        <EmptyState icon="addUser" text="עדיין אין תלמידים" />
        <div style={{ maxWidth: 320, margin: "0 auto" }}>
          <BigButton variant="primary" icon="addUser" onClick={() => setModal("student")}>הוסף תלמיד ראשון</BigButton>
        </div>
      </div>
    );
    switch (tab) {
      case "home":
        return <HomeScreen studentName={active.name} debt={debt} doneCount={doneCount} received={received}
          nextLesson={nextLesson} recent={recent} months={months}
          onAddLesson={() => setModal("lesson")} go={setTab} wide={wide} />;
      case "lessons":
        return <LessonsScreen lessons={myLessons} onMarkDone={markDone} onTogglePaid={togglePaid} onDelete={deleteLesson}
          onAddLesson={() => setModal("lesson")} wide={wide} />;
      case "payments":
        return <PaymentsScreen lessons={myLessons} received={received} wide={wide} />;
      case "summary":
        return <SummaryScreen lessons={myLessons} today={TODAY} wide={wide} />;
      case "settings":
        return <SettingsScreen student={active} onChange={updateStudent} onSave={saveSettings} saved={saved} wide={wide} allLessons={lessons} today={TODAY} />;
      default: return null;
    }
  };

  const modals = (
    <>
      {modal === "lesson" && active && <AddLessonModal defaults={active} onClose={() => setModal(null)} onAdd={addLesson} centered={isDesktop} />}
      {modal === "student" && <AddStudentModal onClose={() => setModal(null)} onAdd={addStudent} centered={isDesktop} />}
    </>
  );

  if (isDesktop) {
    return (
      <ThemeCtx.Provider value={{ dark, toggleDark }}>
        <div className="stage">
          <div className="app desktop">
            <Sidebar active={tab} onChange={setTab} students={students} activeId={active ? active.id : null}
              onSelect={setActiveId} onAddStudent={() => setModal("student")} lessons={lessons} today={TODAY} />
            <main className="main" ref={scrollRef}>{renderScreen(true)}</main>
            {modals}
          </div>
        </div>
      </ThemeCtx.Provider>
    );
  }

  return (
    <ThemeCtx.Provider value={{ dark, toggleDark }}>
      <div className="stage">
        <div className="app mobile">
          <MobileHeader students={students} activeId={active ? active.id : null} onSelect={setActiveId} onAddStudent={() => setModal("student")} />
          <div className="scroll" ref={scrollRef}>{renderScreen(false)}</div>
          <TabBar active={tab} onChange={setTab} />
          {modals}
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
